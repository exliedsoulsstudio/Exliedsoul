
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fana-e-Hayat | EXILED SOULS</title>
    <link rel="stylesheet" href="style.css">

    <style>
        .novel-page {
            max-width: 1000px;
            margin: auto;
            padding: 40px 20px;
            color: #17191A;
        }

        /* Back to Library Button */
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 25px;
            padding: 12px 18px;
            background: #FBF9F4;
            color: #17191A;
            border: 1px solid #D8CFC0;
            text-decoration: none;
            font-family: 'Montserrat', sans-serif;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 1.5px;
            transition: all 0.3s ease;
        }

        .back-btn span {
            font-size: 18px;
            transition: transform 0.3s ease;
        }

        .back-btn:hover {
            background: #17191A;
            color: #FBF9F4;
            border-color: #17191A;
        }

        .back-btn:hover span {
            transform: translateX(-4px);
        }

        /* Novel Hero */
        .novel-hero {
            display: flex;
            flex-wrap: wrap;
            gap: 36px;
            align-items: center;
            padding: 30px;
            background: #FBF9F4;
            border: 1px solid #D8CFC0;
        }

        /* Novel Cover */
        .novel-cover {
            width: 260px;
            max-width: 100%;
            height: auto;
            border-radius: 2px;
            object-fit: cover;
            box-shadow: 0 8px 24px rgba(23, 25, 26, 0.10);
        }

        /* Novel Information */
        .novel-info {
            flex: 1;
            min-width: 240px;
        }

        .novel-info h1,
        .novel-info h2 {
            font-family: 'Cormorant Garamond', serif;
            font-weight: 500;
            color: #17191A;
            line-height: 1.15;
        }

        .novel-info p {
            color: #77716A;
            font-size: 13px;
            line-height: 1.9;
        }

        /* Mockup Gallery */
        .mockups {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 18px;
            margin: 35px 0;
        }

        .mockups img {
            display: block;
            width: 100%;
            height: auto;
            border: 1px solid #D8CFC0;
            border-radius: 2px;
            transition: transform 0.3s ease,
                        box-shadow 0.3s ease;
        }

        .mockups img:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 24px rgba(23, 25, 26, 0.10);
        }

        /* Download Button */
        .download-btn {
            display: inline-block;
            padding: 14px 24px;
            margin: 14px 0;
            border: 1px solid #17191A;
            border-radius: 0;
            background: #17191A;
            color: #FBF9F4;
            text-decoration: none;
            text-align: center;
            font-family: 'Montserrat', sans-serif;
            font-size: 10px;
            letter-spacing: 2px;
            transition: all 0.3s ease;
        }

        .download-btn:hover {
            background: transparent;
            color: #17191A;
        }

        /* Mobile Responsive */
        @media (max-width: 600px) {
            .novel-page {
                padding: 25px 15px;
            }

            .novel-hero {
                flex-direction: column;
                align-items: flex-start;
                gap: 22px;
                padding: 18px;
            }

            .novel-cover {
                width: 100%;
                max-width: 280px;
                margin: auto;
            }

            .novel-info {
                width: 100%;
                min-width: 0;
            }

            .mockups {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 12px;
            }

            .download-btn {
                width: 100%;
                box-sizing: border-box;
            }

            .back-btn {
                margin-bottom: 20px;
            }
        }
    </style>
</head>

<body>
    <main class="novel-page">

        <a href="pdf.html" class="back-btn">
            <span>←</span> BACK TO LIBRARY
        </a>

        <section class="novel-hero">
            <img
                class="novel-cover"
                src="Fana e hayat cover.jpg"
                alt="Fana-e-Hayat novel cover"
            >

            <div class="novel-info">
                <h1>Fana-e-Hayat</h1>
                <p>By <strong>Alkash</strong></p>
                <p>Mystery · Romance · Revenge</p>

                <p>
                    A world of secrets, revenge, and mysteries
                    waiting to unfold.
                </p>

                <a
                    class="download-btn"
                    href="https://novelstudiopk.com/2026/09/02/novels/fana-e-hayat-by-alkash-complete/"
                    target="_blank"
                    rel="noopener"
                >
                    READ / DOWNLOAD NOVEL
                </a>
            </div>
        </section>

        <section>
            <h2>Novel Mockups</h2>

            <div class="mockups">
                <img
                    src="fana-mockup-1.jpg"
                    alt="Fana-e-Hayat mockup 1"
                >

                <img
                    src="fana-mockup-2.jpg"
                    alt="Fana-e-Hayat mockup 2"
                >
            </div>
        </section>

    </main>
</body>
</html>
